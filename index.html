<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칠판 단어 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #3a2f28;
    --wall-shadow: #2a221c;
    --board: #23402f;
    --board-edge: #1a3123;
    --frame: #6b4a34;
    --frame-dark: #4a3324;
    --chalk: #f4f1e6;
    --chalk-dim: #9fb3a4;
    --chalk-yellow: #f2c94c;
    --chalk-coral: #e8737a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background:
      radial-gradient(ellipse at 50% -10%, #4a3c32 0%, var(--wall) 55%, var(--wall-shadow) 100%);
    font-family: "Gowun Dodum", -apple-system, "Malgun Gothic", sans-serif;
    color: var(--chalk);
  }

  .frame {
    background: linear-gradient(155deg, var(--frame), var(--frame-dark));
    border-radius: 14px;
    padding: 14px;
    box-shadow:
      0 24px 50px rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(255,255,255,0.06);
    width: 100%;
    max-width: 480px;
  }

  .board {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.05), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(255,255,255,0.04), transparent 55%),
      var(--board);
    border: 2px solid var(--board-edge);
    border-radius: 8px;
    padding: 28px 24px 22px;
    text-align: center;
    position: relative;
  }

  h1 {
    font-family: "Gaegu", cursive;
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 2px;
    letter-spacing: 0.5px;
    text-shadow: 0 0 14px rgba(244,241,230,0.25);
  }

  .subtitle {
    font-size: 13px;
    color: var(--chalk-dim);
    margin-bottom: 14px;
  }

  .category {
    display: inline-block;
    font-family: "Gaegu", cursive;
    font-size: 16px;
    color: var(--chalk-yellow);
    border-bottom: 2px dashed var(--chalk-yellow);
    padding-bottom: 2px;
    margin-bottom: 18px;
  }

  /* --- hangman doodle --- */
  .doodle-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 6px;
  }
  .doodle-wrap svg {
    width: 92px;
    height: 92px;
  }
  .doodle-wrap svg .fixed {
    stroke: var(--chalk-dim);
  }
  .doodle-wrap svg .part {
    stroke: var(--chalk);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .doodle-wrap svg .part.show {
    opacity: 1;
  }
  .doodle-wrap svg line,
  .doodle-wrap svg circle {
    fill: none;
    stroke-width: 3.5;
    stroke-linecap: round;
  }

  .word-display {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0 18px;
  }

  .letter-box {
    width: 42px;
    height: 52px;
    border-bottom: 3px dashed var(--chalk-dim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
    font-family: "Gaegu", cursive;
    font-size: 26px;
    font-weight: 700;
    color: transparent;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  .letter-box.revealed {
    color: var(--chalk-yellow);
    border-color: var(--chalk-yellow);
    text-shadow: 0 0 10px rgba(242,201,76,0.35);
  }

  .input-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-top: 4px;
  }

  input[type="text"] {
    width: 76px;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--chalk-dim);
    font-family: "Gaegu", cursive;
    font-size: 22px;
    color: var(--chalk);
    text-align: center;
    padding: 6px 4px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--chalk-yellow);
  }
  input[type="text"]::placeholder {
    color: var(--chalk-dim);
    font-size: 13px;
    font-family: "Gowun Dodum", sans-serif;
  }

  button {
    font-family: "Gaegu", cursive;
    font-size: 17px;
    font-weight: 700;
    background: transparent;
    color: var(--chalk);
    border: 2px solid var(--chalk-dim);
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
  }
  button:hover { border-color: var(--chalk); }
  button:active { transform: scale(0.96); }
  button:focus-visible {
    outline: 2px solid var(--chalk-yellow);
    outline-offset: 2px;
  }
  button:disabled { opacity: 0.4; cursor: default; }

  .btn-primary {
    border-color: var(--chalk-yellow);
    color: var(--chalk-yellow);
  }
  .btn-primary:hover { border-color: var(--chalk-yellow); box-shadow: 0 0 10px rgba(242,201,76,0.25); }

  .secondary-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .secondary-row button { flex: 1; font-size: 14px; padding: 9px 8px; }

  .hint-text {
    min-height: 18px;
    font-size: 13px;
    color: var(--chalk-yellow);
    margin-top: 12px;
  }

  .message {
    font-family: "Gaegu", cursive;
    font-size: 19px;
    font-weight: 700;
    margin: 4px 0 0;
    min-height: 26px;
  }
  .message.win { color: var(--chalk-yellow); }
  .message.lose { color: var(--chalk-coral); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="board">
      <h1>단어 맞추기</h1>
      <div class="subtitle">칠판에 숨겨진 단어를 한 글자씩 맞혀보세요</div>
      <div class="category" id="category">카테고리</div>

      <div class="doodle-wrap" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <line class="fixed" x1="15" y1="90" x2="70" y2="90"></line>
          <line class="fixed" x1="30" y1="90" x2="30" y2="12"></line>
          <line class="fixed" x1="30" y1="12" x2="65" y2="12"></line>
          <line class="fixed" x1="65" y1="12" x2="65" y2="24"></line>
          <circle class="part" id="p-head" cx="65" cy="34" r="10"></circle>
          <line class="part" id="p-torso" x1="65" y1="44" x2="65" y2="68"></line>
          <line class="part" id="p-armL" x1="65" y1="50" x2="53" y2="60"></line>
          <line class="part" id="p-armR" x1="65" y1="50" x2="77" y2="60"></line>
          <line class="part" id="p-legL" x1="65" y1="68" x2="55" y2="84"></line>
          <line class="part" id="p-legR" x1="65" y1="68" x2="75" y2="84"></line>
        </svg>
      </div>

      <div class="word-display" id="wordDisplay"></div>

      <div class="input-row">
        <input type="text" id="guessInput" maxlength="1" placeholder="글자" autocomplete="off" aria-label="글자 입력">
        <button class="btn-primary" id="guessBtn">맞추기</button>
      </div>

      <div class="hint-text" id="hintText">&nbsp;</div>
      <div class="message" id="message"></div>

      <div class="secondary-row">
        <button id="hintBtn">힌트 보기</button>
        <button id="restartBtn">새 단어로</button>
      </div>
    </div>
  </div>

<script>
  const WORDS = [
    { word: "사과", category: "과일", hint: "빨갛고 아삭한 과일" },
    { word: "바나나", category: "과일", hint: "노랗고 길쭉한 과일" },
    { word: "호랑이", category: "동물", hint: "숲속의 왕, 줄무늬가 있어요" },
    { word: "코끼리", category: "동물", hint: "코가 아주 긴 큰 동물" },
    { word: "무지개", category: "자연", hint: "비 온 뒤 하늘에 뜨는 일곱 빛깔" },
    { word: "피아노", category: "악기", hint: "건반을 눌러 소리를 내는 악기" },
    { word: "자전거", category: "물건", hint: "두 바퀴로 페달을 밟아 타는 것" },
    { word: "대한민국", category: "나라", hint: "우리가 살고 있는 나라" },
    { word: "눈사람", category: "겨울", hint: "겨울에 눈으로 만드는 사람 모양" },
    { word: "고양이", category: "동물", hint: "야옹 하고 우는 반려동물" },
    { word: "축구공", category: "스포츠", hint: "발로 차는 둥근 공" },
    { word: "김치찌개", category: "음식", hint: "매콤하고 얼큰한 한국 찌개" },
  ];

  const PARTS = ["p-head", "p-torso", "p-armL", "p-armR", "p-legL", "p-legR"];
  const MAX_LIVES = PARTS.length;

  let current, guessedChars, lives, hintUsed;

  const wordDisplay = document.getElementById("wordDisplay");
  const categoryEl = document.getElementById("category");
  const guessInput = document.getElementById("guessInput");
  const guessBtn = document.getElementById("guessBtn");
  const hintBtn = document.getElementById("hintBtn");
  const restartBtn = document.getElementById("restartBtn");
  const hintText = document.getElementById("hintText");
  const messageEl = document.getElementById("message");

  function startGame() {
    current = WORDS[Math.floor(Math.random() * WORDS.length)];
    guessedChars = new Set();
    lives = MAX_LIVES;
    hintUsed = false;
    hintText.innerHTML = "&nbsp;";
    messageEl.textContent = "";
    messageEl.className = "message";
    categoryEl.textContent = current.category;
    guessInput.disabled = false;
    guessBtn.disabled = false;
    guessInput.value = "";
    PARTS.forEach(id => document.getElementById(id).classList.remove("show"));
    render();
    guessInput.focus();
  }

  function render() {
    wordDisplay.innerHTML = "";
    for (const ch of current.word) {
      const box = document.createElement("div");
      box.className = "letter-box";
      if (guessedChars.has(ch)) {
        box.textContent = ch;
        box.classList.add("revealed");
      } else {
        box.textContent = "?";
      }
      wordDisplay.appendChild(box);
    }
    const wrongCount = MAX_LIVES - lives;
    PARTS.forEach((id, i) => {
      document.getElementById(id).classList.toggle("show", i < wrongCount);
    });
  }

  function isWordComplete() {
    return [...current.word].every(ch => guessedChars.has(ch));
  }

  function endGame(won) {
    guessInput.disabled = true;
    guessBtn.disabled = true;
    if (won) {
      messageEl.textContent = "정답입니다! 잘했어요.";
      messageEl.className = "message win";
    } else {
      messageEl.textContent = `아쉬워요! 정답은 "${current.word}" 였어요.`;
      messageEl.className = "message lose";
      guessedChars = new Set(current.word);
      render();
    }
  }

  function handleGuess() {
    const ch = guessInput.value.trim();
    guessInput.value = "";
    guessInput.focus();
    if (!ch) return;

    if (guessedChars.has(ch)) {
      hintText.textContent = "이미 입력한 글자예요.";
      return;
    }

    if (current.word.includes(ch)) {
      guessedChars.add(ch);
      hintText.innerHTML = "&nbsp;";
      render();
      if (isWordComplete()) endGame(true);
    } else {
      lives -= 1;
      hintText.textContent = "틀렸어요, 다시 시도해보세요.";
      render();
      if (lives <= 0) endGame(false);
    }
  }

  guessBtn.addEventListener("click", handleGuess);
  guessInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleGuess();
  });
  hintBtn.addEventListener("click", () => {
    hintText.textContent = "힌트: " + current.hint;
    hintUsed = true;
  });
  restartBtn.addEventListener("click", startGame);

  startGame();
</script>
</body>
</html>
